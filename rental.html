<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gibbs Edu Tech — Institutional Proposal Portal (Confidential)</title>
    <meta name="description" content="Confidential institutional program framework for Gibbs Edu Tech college partnership.">
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/png" href="assets/images/gibbs-icon.png">
    <style>
        /* ===== PORTAL SPECIFIC STYLING ===== */
        .portal-nav {
            background: rgba(12, 14, 26, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(67, 198, 172, 0.2);
            position: sticky;
            top: 0;
            z-index: 999;
            padding: 12px 0;
        }

        .portal-nav .nav-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .portal-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 50px;
            background: rgba(231, 76, 60, 0.15);
            border: 1px solid rgba(231, 76, 60, 0.35);
            color: #e74c3c;
            font-family: var(--font-accent);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .portal-nav-links {
            display: flex;
            align-items: center;
            gap: 22px;
            list-style: none;
        }

        .portal-nav-links a {
            font-family: var(--font-accent);
            font-weight: 500;
            font-size: 0.88rem;
            color: rgba(255, 255, 255, 0.85);
            transition: color var(--transition-fast);
        }

        .portal-nav-links a:hover {
            color: var(--primary-light);
        }

        .portal-nav-links .back-link {
            padding: 8px 16px;
            border-radius: 50px;
            background: rgba(67, 198, 172, 0.12);
            border: 1px solid rgba(67, 198, 172, 0.3);
            color: var(--primary-light);
            font-weight: 600;
        }

        .portal-nav-links .back-link:hover {
            background: var(--gradient-primary);
            color: white;
        }

        /* ===== COMMISSION & RENTAL HERO ===== */
        .rental-hero {
            background: var(--gradient-hero);
            padding: 90px 0 60px;
            text-align: center;
            position: relative;
        }

        .rental-hero .confidential-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            border-radius: 50px;
            background: rgba(231, 76, 60, 0.15);
            border: 1px solid rgba(231, 76, 60, 0.3);
            color: #e74c3c;
            font-family: var(--font-accent);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .rental-hero h1 {
            font-family: var(--font-display);
            font-size: clamp(2.2rem, 5vw, 3.2rem);
            font-weight: 800;
            color: var(--text-white);
            margin-bottom: 16px;
        }

        .rental-hero p {
            color: var(--text-on-dark);
            font-size: 1.08rem;
            max-width: 760px;
            margin: 0 auto;
            line-height: 1.7;
        }

        /* ===== SECTION TABS / QUICK JUMP ===== */
        .portal-subnav {
            background: var(--bg-card-dark);
            border-bottom: 1px solid var(--border-dark);
            padding: 12px 0;
            overflow-x: auto;
        }

        .subnav-pills {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            list-style: none;
            min-width: max-content;
        }

        .subnav-pills a {
            padding: 8px 18px;
            border-radius: 50px;
            font-family: var(--font-accent);
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-light);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all var(--transition-fast);
        }

        .subnav-pills a:hover {
            background: rgba(67, 198, 172, 0.15);
            border-color: rgba(67, 198, 172, 0.3);
            color: var(--primary-light);
        }

        /* ===== RENTAL TIERS GRID ===== */
        .rental-tiers {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 56px;
        }

        .rental-tier-card {
            border-radius: var(--border-radius);
            padding: 36px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all var(--transition-med);
            border: 1px solid rgba(67, 198, 172, 0.12);
            background: var(--bg-card-dark);
        }

        .rental-tier-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
        }

        .rental-tier-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            border-radius: 4px 4px 0 0;
        }

        .tier-bronze { background: linear-gradient(180deg, #fef3e2 0%, #ffffff 100%); }
        .tier-bronze::before { background: linear-gradient(90deg, #cd7f32, #e8a858); }
        .tier-bronze .tier-label { color: #cd7f32; }

        .tier-silver { background: linear-gradient(180deg, #f0f0f5 0%, #ffffff 100%); }
        .tier-silver::before { background: linear-gradient(90deg, #808090, #a8a8b8); }
        .tier-silver .tier-label { color: #6a6a80; }

        .tier-gold { background: linear-gradient(180deg, #fdf7e4 0%, #ffffff 100%); }
        .tier-gold::before { background: linear-gradient(90deg, #d4a017, #f7cf2e); }
        .tier-gold .tier-label { color: #b8860b; }

        .tier-platinum {
            background: linear-gradient(180deg, #e8f8f5 0%, #ffffff 100%);
            border-color: rgba(67, 198, 172, 0.3);
            box-shadow: 0 4px 20px rgba(67, 198, 172, 0.1);
        }
        .tier-platinum::before { background: var(--gradient-primary); }
        .tier-platinum .tier-label { color: var(--primary-dark); }

        .tier-diamond {
            background: linear-gradient(180deg, #ebf5fb 0%, #ffffff 100%);
            border-color: rgba(52, 152, 219, 0.3);
            box-shadow: 0 4px 20px rgba(52, 152, 219, 0.1);
        }
        .tier-diamond::before { background: linear-gradient(90deg, #3498db, #5dade2); }
        .tier-diamond .tier-label { color: #2980b9; }

        .tier-label {
            font-family: var(--font-accent);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .tier-students {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .tier-students i {
            font-size: 1.2rem;
            color: var(--primary);
        }

        .tier-students-count {
            font-family: var(--font-display);
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .tier-students-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .tier-divider {
            width: 40px;
            height: 2px;
            background: rgba(67, 198, 172, 0.2);
            margin: 0 auto 20px;
        }

        .tier-rental-detail {
            padding: 14px 16px;
            border-radius: var(--border-radius-xs);
            background: rgba(67, 198, 172, 0.08);
            border: 1px solid rgba(67, 198, 172, 0.15);
        }

        .tier-rental-detail p {
            font-size: 0.82rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .tier-rental-detail strong {
            display: block;
            font-size: 1.25rem;
            font-family: var(--font-display);
            color: var(--text-primary);
            margin-top: 4px;
        }

        .tier-best {
            position: relative;
        }

        .tier-best-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 4px 10px;
            border-radius: 50px;
            background: var(--gradient-primary);
            color: white;
            font-size: 0.65rem;
            font-weight: 700;
            font-family: var(--font-accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ===== RENTAL SUMMARY TABLE ===== */
        .rental-summary {
            max-width: 900px;
            margin: 0 auto 48px;
        }

        .rental-summary h3 {
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-primary);
            text-align: center;
            margin-bottom: 24px;
        }

        .rental-table-wrap {
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(67, 198, 172, 0.12);
        }

        .rental-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
        }

        .rental-table thead {
            background: var(--gradient-primary);
        }

        .rental-table thead th {
            padding: 16px 20px;
            color: var(--text-white);
            font-family: var(--font-accent);
            font-weight: 600;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        .rental-table thead th:first-child {
            text-align: left;
        }

        .rental-table tbody td {
            padding: 16px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            color: var(--text-primary);
        }

        .rental-table tbody td:first-child {
            text-align: left;
            font-weight: 600;
        }

        .rental-table tbody tr:nth-child(even) {
            background: rgba(67, 198, 172, 0.03);
        }

        .rental-table tbody tr:hover {
            background: rgba(67, 198, 172, 0.08);
        }

        .rental-highlight {
            color: var(--primary-dark);
            font-weight: 700;
            font-size: 1.05rem;
        }

        /* ===== RENTAL NOTES ===== */
        .rental-notes {
            max-width: 800px;
            margin: 0 auto;
            padding: 28px 32px;
            border-radius: var(--border-radius);
            background: linear-gradient(135deg, rgba(67, 198, 172, 0.06), rgba(25, 22, 84, 0.04));
            border: 1px solid rgba(67, 198, 172, 0.15);
        }

        .rental-notes h4 {
            font-family: var(--font-accent);
            font-size: 0.98rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rental-notes h4 i { color: var(--primary); }

        .rental-notes ul { list-style: none; }

        .rental-notes ul li {
            padding: 8px 0;
            font-size: 0.9rem;
            color: var(--text-secondary);
            display: flex;
            align-items: flex-start;
            gap: 10px;
            line-height: 1.5;
        }

        .rental-notes ul li i {
            color: var(--primary);
            font-size: 0.75rem;
            margin-top: 6px;
        }

        /* ===== DETAILED CURRICULUM ACCORDION CARDS ===== */
        .curriculum-track-card {
            background: var(--bg-white);
            border: 1px solid rgba(67, 198, 172, 0.18);
            border-radius: var(--border-radius);
            margin-bottom: 28px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: all var(--transition-med);
        }

        .curriculum-track-card:hover {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-color: var(--primary);
        }

        .curriculum-track-header {
            padding: 28px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            background: linear-gradient(90deg, rgba(67, 198, 172, 0.04), transparent);
        }

        .curriculum-track-title-group {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .curriculum-track-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .curriculum-track-name {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .curriculum-track-tags {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--primary-dark);
            font-weight: 500;
        }

        .curriculum-track-body {
            padding: 32px;
        }

        .curriculum-track-desc {
            font-size: 0.96rem;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 24px;
        }

        .month-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .month-card {
            background: rgba(67, 198, 172, 0.04);
            border: 1px solid rgba(67, 198, 172, 0.12);
            border-radius: var(--border-radius-sm);
            padding: 20px;
        }

        .month-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(67, 198, 172, 0.15);
        }

        .month-card-tag {
            font-family: var(--font-accent);
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .month-card-weeks {
            font-size: 0.78rem;
            color: var(--text-secondary);
        }

        .month-card ul {
            list-style: none;
        }

        .month-card ul li {
            padding: 6px 0;
            font-size: 0.85rem;
            color: var(--text-primary);
            display: flex;
            align-items: flex-start;
            gap: 8px;
            line-height: 1.5;
        }

        .month-card ul li::before {
            content: '•';
            color: var(--primary);
            font-weight: bold;
            font-size: 1.1rem;
            line-height: 1;
        }

        @media (max-width: 1024px) {
            .rental-tiers { grid-template-columns: repeat(2, 1fr); }
            .month-grid { grid-template-columns: 1fr; }
            .curriculum-track-header { flex-direction: column; align-items: flex-start; }
            .portal-nav-links { display: none; }
        }

        @media (max-width: 600px) {
            .rental-tiers { grid-template-columns: 1fr; }
            .rental-hero h1 { font-size: 1.8rem; }
            .rental-table { font-size: 0.8rem; }
            .rental-table thead th, .rental-table tbody td { padding: 10px 8px; }
        }
    </style>
</head>

</div>

    async function deriveKey(password, salt) {
        const encoder = new TextEncoder();
        const keyMaterial = await window.crypto.subtle.importKey(
            "raw",
            encoder.encode(password),
            { name: "PBKDF2" },
            false,
            ["deriveKey"]
        );
        return window.crypto.subtle.deriveKey(
            {
                name: "PBKDF2",
                salt: salt,
                iterations: 100000,
                hash: "SHA-256"
            },
            keyMaterial,
            { name: "AES-GCM", length: 256 },
            false,
            ["decrypt"]
        );
    }

    async function decryptData(encryptedB64, password) {
        const binaryString = window.atob(encryptedB64);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
        }
        
        const salt = bytes.slice(0, 16);
        const iv = bytes.slice(16, 16 + 12);
        const ciphertext = bytes.slice(16 + 12);
        
        const key = await deriveKey(password, salt);
        const decrypted = await window.crypto.subtle.decrypt(
            {
                name: "AES-GCM",
                iv: iv
            },
            key,
            ciphertext
        );
        return new TextDecoder().decode(decrypted);
    }

    // Handle unlocking
    passwordForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = passwordInput.value.trim();
        
        try {
            const html = await decryptData(encryptedPayload, password);
            
            // Decryption succeeded! Render body
            decryptedContent.innerHTML = html;
            
            // Hide gate and show content
            passwordError.classList.remove('show');
            passwordGate.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
            passwordGate.style.opacity = '0';
            passwordGate.style.transform = 'scale(0.95)';

            setTimeout(() => {
                passwordGate.style.display = 'none';
                decryptedContent.classList.add('unlocked');
                window.scrollTo({ top: 0 });
                
                // Re-run any scripts contained inside the decrypted HTML
                const scripts = Array.from(decryptedContent.getElementsByTagName('script'));
                for (let script of scripts) {
                    const newScript = document.createElement('script');
                    if (script.src) {
                        newScript.src = script.src;
                    } else {
                        newScript.textContent = script.textContent;
                    }
                    document.body.appendChild(newScript);
                }
                
                // Re-init client side interactivity
                window.dispatchEvent(new Event('DOMContentLoaded'));
                window.dispatchEvent(new Event('load'));
            }, 500);
            
        } catch (err) {
            console.error("Decryption failed:", err);
            passwordError.classList.add('show');
            passwordInput.value = '';
            passwordInput.focus();

            passwordError.style.animation = 'none';
            passwordError.offsetHeight; // force reflow
            passwordError.style.animation = '';
        }
    });

    passwordInput.focus();
</script>
