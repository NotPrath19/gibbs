    // Toggle password visibility
    togglePassword.addEventListener('click', () => {
        const type = passwordInput.type === 'password' ? 'text' : 'password';
        passwordInput.type = type;
        togglePassword.innerHTML = type === 'password'
            ? '<i class="fas fa-eye"></i>'
            : '<i class="fas fa-eye-slash"></i>';
    });

    // Helper functions for Web Crypto AES-GCM Decryption
    async function deriveKey(password, salt) {
        const encoder = new TextEncoder();
        const keyMaterial = await window.crypto.subtle.importKey(
            "raw",
            encoder.encode(password),
            { name: "PBKDF2" },
            false,
            ["deriveKey"]
        );
        return window.crypto.subtle.deriveKey(
            {
                name: "PBKDF2",
                salt: salt,
                iterations: 100000,
                hash: "SHA-256"
            },
            keyMaterial,
            { name: "AES-GCM", length: 256 },
            false,
            ["decrypt"]
        );
    }

    async function decryptData(encryptedB64, password) {
        const binaryString = window.atob(encryptedB64);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
        }
        
        const salt = bytes.slice(0, 16);
        const iv = bytes.slice(16, 16 + 12);
        const ciphertext = bytes.slice(16 + 12);
        
        const key = await deriveKey(password, salt);
        const decrypted = await window.crypto.subtle.decrypt(
            {
                name: "AES-GCM",
                iv: iv
            },
            key,
            ciphertext
        );
        return new TextDecoder().decode(decrypted);
    }

    // Handle unlocking
    passwordForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = passwordInput.value.trim();
        
        try {
            const html = await decryptData(encryptedPayload, password);
            
            // Decryption succeeded! Render body
            decryptedContent.innerHTML = html;
            
            // Hide gate and show content
            passwordError.classList.remove('show');
            passwordGate.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
            passwordGate.style.opacity = '0';
            passwordGate.style.transform = 'scale(0.95)';

            setTimeout(() => {
                passwordGate.style.display = 'none';
                decryptedContent.classList.add('unlocked');
                window.scrollTo({ top: 0 });
                
                // Re-run any scripts contained inside the decrypted HTML
                const scripts = Array.from(decryptedContent.getElementsByTagName('script'));
                for (let script of scripts) {
                    const newScript = document.createElement('script');
                    if (script.src) {
                        newScript.src = script.src;
                    } else {
                        newScript.textContent = script.textContent;
                    }
                    document.body.appendChild(newScript);
                }
                
                // Re-init client side interactivity
                window.dispatchEvent(new Event('DOMContentLoaded'));
                window.dispatchEvent(new Event('load'));
            }, 500);
            
        } catch (err) {
            console.error("Decryption failed:", err);
            passwordError.classList.add('show');
            passwordInput.value = '';
            passwordInput.focus();

            passwordError.style.animation = 'none';
            passwordError.offsetHeight; // force reflow
            passwordError.style.animation = '';
        }
    });

    passwordInput.focus();
</script>
